<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIPS THE BIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--card-hover:#334155;--border:#334155;--text:#f1f5f9;--text-muted:#94a3b8;--primary:#3b82f6;--primary-hover:#2563eb;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#a855f7;--radius:12px;--radius-sm:8px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);border-bottom:1px solid var(--border);padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.header h1{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header span{font-size:.875rem;color:var(--text-muted)}
.nav{display:flex;gap:.25rem;padding:.75rem 2rem;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.nav button{padding:.625rem 1.25rem;border:none;background:transparent;color:var(--text-muted);font-family:inherit;font-size:.875rem;font-weight:500;cursor:pointer;border-radius:var(--radius-sm);white-space:nowrap;transition:all .15s}
.nav button:hover{color:var(--text);background:var(--card-hover)}
.nav button.active{color:var(--primary);background:rgba(59,130,246,.15)}
.main{max-width:1400px;margin:0 auto;padding:2rem}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1.125rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.loading{text-align:center;padding:3rem;color:var(--text-muted)}.loading::after{content:'';display:block;width:32px;height:32px;margin:1rem auto;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{padding:1rem;color:var(--danger);background:rgba(239,68,68,.1);border-radius:var(--radius-sm);margin-bottom:1rem;font-size:.875rem}
.form-row{display:flex;gap:1rem;flex-wrap:wrap;align-items:end;margin-bottom:1.5rem}
.form-group{display:flex;flex-direction:column;gap:.375rem}
.form-group label{font-size:.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.form-group input,.form-group select{padding:.5rem .75rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:.875rem}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.btn{padding:.5rem 1.25rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:.875rem;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--primary-hover)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:.375rem .75rem;font-size:.75rem}
.text-success{color:var(--success)}.text-warning{color:var(--warning)}.text-danger{color:var(--danger)}.text-info{color:var(--info)}
.team-crest{width:20px;height:20px;vertical-align:middle;object-fit:contain}
.match-crest{width:18px;height:18px;vertical-align:middle;object-fit:contain}
/* World Cup Dashboard */
.wc-tabs{display:flex;gap:.375rem;flex-wrap:wrap;margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:.75rem}
.wc-tab{padding:.5rem 1rem;border:none;background:var(--bg);color:var(--text-muted);font-family:inherit;font-size:.8125rem;font-weight:500;cursor:pointer;border-radius:var(--radius-sm);transition:all .15s}
.wc-tab:hover{color:var(--text);background:var(--card-hover)}
.wc-tab.active{color:var(--primary);background:rgba(59,130,246,.15)}
.wc-panel{display:none}.wc-panel.active{display:block}
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:1.25rem}
.group-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.group-card h3{padding:.875rem 1rem;font-size:.9375rem;font-weight:600;background:linear-gradient(90deg,rgba(59,130,246,.1),transparent);border-bottom:1px solid var(--border)}
.group-body{padding:1rem}
.standings-table{width:100%;border-collapse:collapse;font-size:.8125rem;margin-bottom:1rem}
.standings-table th{padding:.5rem .375rem;text-align:left;font-size:.6875rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
.standings-table td{padding:.4375rem .375rem;border-bottom:1px solid rgba(51,65,85,.5)}
.standings-table .pos{font-weight:700;width:24px;text-align:center;color:var(--text-muted)}
.standings-table .team-cell{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.standings-table .pts{font-weight:700}
.standings-table .gd{font-size:.75rem;color:var(--text-muted)}
.group-matches{display:flex;flex-direction:column;gap:.5rem}
.group-match{display:flex;align-items:center;gap:.5rem;padding:.5rem .625rem;background:var(--bg);border-radius:var(--radius-sm);font-size:.8125rem;flex-wrap:wrap}
.group-match .teams{flex:1;min-width:0}
.group-match .teams .tm{display:flex;align-items:center;gap:.375rem;line-height:1.4}
.group-match .score-badge{padding:.25rem .5rem;border-radius:4px;font-weight:700;font-size:.8125rem;min-width:40px;text-align:center}
.group-match .score-badge.live{background:rgba(34,197,94,.15);color:var(--success);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.group-match .pred-badge{font-size:.6875rem;padding:.125rem .375rem;border-radius:3px;color:var(--text-muted)}
.group-match .pred-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:.25rem;width:100%}
.group-match .pred-bar span{transition:width .5s}
.match-date{font-size:.6875rem;color:var(--text-muted);white-space:nowrap}
.knockout-section{margin-top:2rem}
.knockout-section h3{font-size:1rem;font-weight:600;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.knockout-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem}
.live-indicator{display:inline-flex;align-items:center;gap:.375rem;font-size:.6875rem;color:var(--success);padding:.125rem .5rem;background:rgba(34,197,94,.1);border-radius:4px}
.live-dot{width:6px;height:6px;background:var(--success);border-radius:50%;animation:pulse 1.5s infinite}
.refresh-bar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.refresh-bar .info{font-size:.75rem;color:var(--text-muted)}
.tournament-table{width:100%;border-collapse:collapse;font-size:.875rem}
.tournament-table th{padding:.75rem .5rem;text-align:left;font-size:.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.tournament-table td{padding:.625rem .5rem;border-bottom:1px solid var(--border)}
.tournament-table tr:hover td{background:var(--card-hover)}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;min-width:120px}
.bar-fill{height:100%;border-radius:3px;transition:width .5s}
/* Match Card (Hoy / Próximos) */
.match-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card);margin-bottom:1.25rem}
.match-card .mc-header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;background:linear-gradient(90deg,rgba(59,130,246,.08),transparent);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.5rem}
.match-card .mc-header .mc-teams{display:flex;align-items:center;gap:1rem;flex:1}
.match-card .mc-header .mc-team{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.9375rem}
.match-card .mc-header .mc-team.right{flex-direction:row-reverse}
.match-card .mc-header .mc-vs{font-size:.75rem;color:var(--text-muted);font-weight:500}
.match-card .mc-header .mc-score{font-weight:700;font-size:1.125rem;min-width:48px;text-align:center}
.match-card .mc-header .mc-score.live{color:var(--success);animation:pulse 1.5s infinite}
.match-card .mc-body{padding:1rem}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem;margin-bottom:1rem}
.mc-stat{padding:.75rem;background:var(--bg);border-radius:var(--radius-sm);text-align:center}
.mc-stat .val{font-size:1.25rem;font-weight:700;color:var(--primary)}
.mc-stat .lbl{font-size:.6875rem;color:var(--text-muted);margin-top:.125rem;text-transform:uppercase;letter-spacing:.04em}
.mc-stat.best{outline:2px solid var(--success);outline-offset:-2px}
.mc-stat.best .val{color:var(--success)}
.mc-bar{height:8px;border-radius:4px;overflow:hidden;background:var(--bg);margin-bottom:.5rem}
.mc-bar span{height:100%;float:left;transition:width .5s}
.mc-probs{display:flex;gap:1rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
.mc-prob{text-align:center;padding:.5rem 1rem;background:var(--bg);border-radius:var(--radius-sm);flex:1;min-width:80px}
.mc-prob .pct{font-size:1rem;font-weight:700}
.mc-prob .plbl{font-size:.6875rem;color:var(--text-muted);text-transform:uppercase}
.mc-prob.highlight{background:rgba(34,197,94,.12);outline:1px solid var(--success)}
.mc-prob.highlight .pct{color:var(--success)}
.scores-grid{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.score-chip{display:flex;align-items:center;gap:.375rem;padding:.375rem .625rem;background:var(--bg);border-radius:6px;font-size:.8125rem;font-weight:500}
.score-chip .scp{font-size:.6875rem;color:var(--text-muted)}
.ou-row{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.ou-badge{display:flex;align-items:center;gap:.5rem;padding:.375rem .75rem;border-radius:6px;font-size:.8125rem;font-weight:600}
.ou-badge.over{background:rgba(59,130,246,.12);color:var(--primary)}
.ou-badge.under{background:rgba(245,158,11,.12);color:var(--warning)}
.ou-badge .oup{font-weight:400;font-size:.75rem;opacity:.8}
.btts-row{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.btts-badge{padding:.375rem .75rem;border-radius:6px;font-size:.8125rem;font-weight:600}
.btts-badge.yes{background:rgba(34,197,94,.12);color:var(--success)}
.btts-badge.no{background:rgba(239,68,68,.12);color:var(--danger)}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin-top:1rem}
.rec-card{padding:.75rem 1rem;border-radius:var(--radius-sm);text-align:center}
.rec-card.resultado{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25)}
.rec-card.overunder{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25)}
.rec-card.btts{background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.25)}
.rec-card .rec-icon{font-size:1rem;margin-bottom:.25rem}
.rec-card .rec-label{font-size:.625rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:.125rem}
.rec-card .rec-value{font-size:1.125rem;font-weight:700}
.rec-card .rec-pct{font-size:.75rem;color:var(--text-muted)}
.rec-card.resultado .rec-value{color:var(--primary)}
.rec-card.overunder .rec-value{color:var(--warning)}
.rec-card.btts .rec-value{color:var(--info)}
/* Value Bets */
.vb-grid{display:grid;gap:1rem}
.vb-item{padding:1.25rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)}
.vb-item .vb-header{display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem}
.vb-item .vb-header .vb-match{font-weight:600;font-size:.9375rem}
.vb-item .vb-header .vb-date{font-size:.75rem;color:var(--text-muted)}
.vb-item .vb-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.75rem}
.vb-item .vb-stat{text-align:center}
.vb-item .vb-stat .vbv{font-weight:700;font-size:1rem}
.vb-item .vb-stat .vbl{font-size:.6875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:.0625rem}
.vb-item .vb-stat .vbv.positive{color:var(--success)}
.vb-item .vb-stat .vbv.warning{color:var(--warning)}
.vb-item .vb-stake{display:flex;align-items:center;gap:.75rem;margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border);flex-wrap:wrap}
.vb-item .vb-stake input{width:120px;padding:.375rem .5rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:.875rem;text-align:right}
.vb-item .vb-stake input:focus{outline:none;border-color:var(--primary)}
.vb-item .vb-stake .profit{font-weight:700;font-size:1rem;color:var(--success)}
.vb-item .vb-stake .profit.negative{color:var(--danger)}
.vb-item .vb-stake .plbl{font-size:.75rem;color:var(--text-muted)}
.stake-input-top{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding:.75rem 1rem;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border)}
.stake-input-top label{font-size:.8125rem;font-weight:600;color:var(--text-muted)}
.stake-input-top input{width:140px;padding:.5rem .75rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:.875rem;text-align:right}
.stake-input-top input:focus{outline:none;border-color:var(--primary)}
.lbl-section{font-size:.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem}
.lbl-section::after{content:'';flex:1;height:1px;background:var(--border)}
/* Value Bets v2 */
.vb2-grid{display:grid;gap:1.25rem}
.vb2-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
.vb2-header{display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.vb2-match{font-weight:600;font-size:.9375rem}
.vb2-date{font-size:.75rem;color:var(--text-muted)}
.vb2-featured{background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(168,85,247,.12));border:1px solid rgba(59,130,246,.3);border-radius:var(--radius);padding:1rem;margin-bottom:1rem;text-align:center}
.vb2-featured .lbl{font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:.25rem}
.vb2-featured .val{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.vb2-featured .sub{font-size:.8125rem;color:var(--text-muted);margin-top:.25rem}
.vb2-bets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:1rem}
.vb2-bet{background:var(--bg);border-radius:var(--radius-sm);padding:.75rem;text-align:center;border:1px solid var(--border);transition:all .15s}
.vb2-bet:hover{border-color:var(--primary)}
.vb2-bet .ico{font-size:1.125rem;margin-bottom:.25rem}
.vb2-bet .cat{font-size:.625rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:.125rem}
.vb2-bet .val{font-size:1rem;font-weight:700}
.vb2-bet .sub{font-size:.6875rem;color:var(--text-muted);margin-top:.125rem}
.vb2-bet.segura .val{color:var(--success)}
.vb2-bet.recomendada .val{color:var(--primary)}
.vb2-bet.arriesgada .val{color:var(--warning)}
.vb2-bet.sonadora .val{color:var(--danger)}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;overflow-y:auto;padding:2rem 1rem}
.modal-overlay.open{display:block}
.modal-content{max-width:900px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem;background:linear-gradient(135deg,#1e293b,#0f172a);border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1.125rem;font-weight:700}
.modal-close{background:transparent;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;padding:.25rem;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:1.5rem}
.modal-score{text-align:center;padding:1.5rem;background:var(--bg);border-radius:var(--radius);margin-bottom:1.5rem}
.modal-score .teams{display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap}
.modal-score .team{text-align:center}
.modal-score .team .name{font-size:1.125rem;font-weight:600}
.modal-score .team .crest{width:48px;height:48px;object-fit:contain}
.modal-score .score-display{font-size:2.5rem;font-weight:800;color:var(--primary);min-width:100px;text-align:center}
.modal-score .score-display.live{color:var(--success);animation:pulse 1.5s infinite}
.modal-score .status-badge{display:inline-block;padding:.25rem .75rem;border-radius:4px;font-size:.75rem;font-weight:600;margin-top:.5rem}
.modal-score .status-badge.live{background:rgba(34,197,94,.15);color:var(--success)}
.modal-score .status-badge.finished{background:rgba(148,163,184,.1);color:var(--text-muted)}
.modal-score .status-badge.scheduled{background:rgba(59,130,246,.1);color:var(--primary)}
/* Events timeline */
.events-timeline{margin-bottom:1.5rem}
.events-timeline h3{font-size:.875rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.event-item{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:.375rem;font-size:.8125rem}
.event-item .minute{font-weight:700;color:var(--text-muted);min-width:32px;font-size:.75rem}
.event-item .icon{font-size:1rem;min-width:20px;text-align:center}
.event-item .desc{flex:1}
.event-item.goal{border-left:3px solid var(--success)}
.event-item.yellow-card{border-left:3px solid var(--warning)}
.event-item.red-card{border-left:3px solid var(--danger)}
.event-item.substitution{border-left:3px solid var(--primary)}
/* Detail grid */
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-bottom:1.5rem}
.detail-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem}
.detail-card h4{font-size:.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
.detail-card .row{display:flex;justify-content:space-between;padding:.25rem 0;font-size:.8125rem}
.detail-card .row .val{font-weight:600}
.detail-card .row .val.positive{color:var(--success)}
.detail-card .row .val.warning{color:var(--warning)}
.detail-card .row .val.danger{color:var(--danger)}
.detail-card .row .val.info{color:var(--info)}
.prob-bar{height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin:.25rem 0 .5rem}
.prob-bar span{display:block;height:100%;border-radius:3px;transition:width .3s}
.specials-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem}
.special-item{padding:.75rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);text-align:center}
.special-item .ico{font-size:1.25rem;margin-bottom:.25rem}
.special-item .lbl{font-size:.6875rem;color:var(--text-muted);margin-bottom:.125rem}
.special-item .val{font-size:.9375rem;font-weight:600}
.clickable{cursor:pointer;transition:all .15s}
.clickable:hover{background:var(--card-hover);border-color:var(--primary)}
@media(max-width:768px){.main{padding:1rem}.group-grid{grid-template-columns:1fr}.knockout-grid{grid-template-columns:1fr}.header{flex-direction:column;text-align:center;padding:1rem}.nav{padding:.5rem 1rem;overflow-x:auto}.match-card .mc-header .mc-teams{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<header class="header">
<div><h1>TIPS THE BIRD</h1><span>Poisson + Elo + Monte Carlo · <span id="live-status">Datos en vivo</span></span></div>
<div style="font-size:.75rem;color:var(--text-muted)">Football-data.org · ESPN</div>
</header>

<nav class="nav" id="nav">
<button class="active" data-tab="worldcup">🌍 Mundial</button>
<button data-tab="today">📅 Hoy</button>
<button data-tab="upcoming">📅 Próximos</button>
<button data-tab="valuebets">💰 Value Bets</button>
</nav>

<main class="main">
<!-- === WORLD CUP DASHBOARD === -->
<div class="tab active" id="tab-worldcup">
<div class="card">
<div class="refresh-bar">
<h2>🌍 Mundial 2026 · Fase de Grupos y Eliminatorias</h2>
<div class="info">Actualizando cada 30s · <span id="wc-timestamp"></span></div>

<script>
const BASE = '/api/v1/predictions';
let wcTimer = null;
let wcData = null;

// Navigation
document.querySelectorAll('#nav button').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
btn.classList.add('active');
document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
if (btn.dataset.tab === 'worldcup') loadWorldCup();
else if (btn.dataset.tab === 'today') loadToday();
else if (btn.dataset.tab === 'upcoming') loadUpcoming();
else if (btn.dataset.tab === 'valuebets') loadValueBets();
});
});

function showLoading(el) { el.innerHTML = '<div class="loading">Cargando...</div>'; }
function showError(el, msg) { el.innerHTML = '<div class="error">' + msg + '</div>'; }

async function apiGet(url) {
const res = await fetch(url);
if (!res.ok) {
let msg = 'Error ' + res.status;
try { const j = await res.json(); const e = j.error || j.detail || j.message || j; msg = typeof e === 'object' ? (e.message || e.error || JSON.stringify(e)) : String(e); } catch(e) { msg = 'Error ' + res.status; }
throw new Error(msg);
}
return res.json();
}

/* ─────── POISSON HELPERS ─────── */
function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
function poissonProb(goals, expected) {
if (expected <= 0) return goals === 0 ? 1 : 0;
return Math.exp(-expected) * Math.pow(expected, goals) / factorial(goals);
}
function scoreProbsList(expHome, expAway, maxG = 8) {
const probs = [];
for (let i = 0; i <= maxG; i++) {
for (let j = 0; j <= maxG; j++) {
probs.push({h: i, a: j, p: poissonProb(i, expHome) * poissonProb(j, expAway)});
}
}
probs.sort((a, b) => b.p - a.p);
return probs.slice(0, 5);
}
function overProb(expHome, expAway, threshold) {
let over = 0, total = 0;
for (let i = 0; i <= 10; i++) {
for (let j = 0; j <= 10; j++) {
const p = poissonProb(i, expHome) * poissonProb(j, expAway);
total += p;
if (i + j > threshold) over += p;
}
}
return total > 0 ? over / total : 0;
}
function bttsProb(expHome, expAway) {
let both = 0, total = 0;
for (let i = 0; i <= 10; i++) {
for (let j = 0; j <= 10; j++) {
const p = poissonProb(i, expHome) * poissonProb(j, expAway);
total += p;
if (i > 0 && j > 0) both += p;
}
}
return total > 0 ? both / total : 0;
}
function dateStr(d) {
const y = d.getFullYear();
const m = String(d.getMonth() + 1).padStart(2, '0');
const day = String(d.getDate()).padStart(2, '0');
return y + '-' + m + '-' + day;
}
function getMexicoDateStr(date) {
return new Intl.DateTimeFormat('en-CA', {timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(date||new Date());
}
function getMexicoDate(date) {
return new Date((date||new Date()).toLocaleString('en-US',{timeZone:'America/Mexico_City'}));
}

/* ─────── WORLD CUP DASHBOARD ─────── */
async function loadWorldCup() {
const el = document.getElementById('wc-content');
if (!el) return;
if (!el.innerHTML) showLoading(el);
try {
const data = await apiGet(BASE + '/worldcup/');
wcData = data;
renderWorldCup(el, data);
document.getElementById('wc-timestamp').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-MX',{timeZone:'America/Mexico_City'});
} catch(e) { showError(el, 'Error al cargar: ' + e.message); }
scheduleWCRefresh();
}
function scheduleWCRefresh() {
if (wcTimer) clearTimeout(wcTimer);
wcTimer = setTimeout(loadWorldCup, 30000);
}
function stopWCRefresh() { if (wcTimer) { clearTimeout(wcTimer); wcTimer = null; } }

function renderWorldCup(el, data) {
if (!data || data.error) { showError(el, data?.error || 'Sin datos'); return; }
if (!data.groups || Object.keys(data.groups).length === 0) { el.innerHTML = '<p style="color:var(--text-muted)">No hay datos de grupos disponibles.</p>'; return; }

const groupKeys = Object.keys(data.groups).sort();
const stageOrder = ['LAST_32', 'LAST_16', 'QUARTER_FINALS', 'SEMI_FINALS', 'THIRD_PLACE', 'FINAL'];
const stageLabels = {'LAST_32':'🏀 32avos','LAST_16':'🏀 16avos','QUARTER_FINALS':'🏠 Cuartos','SEMI_FINALS':'🏆 Semifinales','THIRD_PLACE':'🥉 3er Lugar','FINAL':'🏆 Final'};

let html = '<div class="wc-tabs">';
html += '<button class="wc-tab active" data-wc="groups" onclick="switchWCTab(\'groups\')">📊 Grupos</button>';
if (data.knockout) {
for (const stage of stageOrder) {
if (data.knockout[stage]) html += `<button class="wc-tab" data-wc="${stage}" onclick="switchWCTab('${stage}')">${stageLabels[stage]||stage}</button>`;
}
}
html += '</div>';

html += '<div class="wc-panel active" id="wc-panel-groups"><div class="group-grid">';
for (const gk of groupKeys) {
const g = data.groups[gk];
const standings = g.standings || [];
const matches = g.matches || [];
html += '<div class="group-card"><h3>' + (g.name||gk.replace('GROUP_','Grupo ')) + '</h3><div class="group-body">';
if (standings.length) {
html += '<table class="standings-table"><thead><tr><th></th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>Pts</th></tr></thead><tbody>';
for (const s of standings) {
html += `<tr><td class="pos">${s.position}</td><td class="team-cell">${s.team_crest?'<img class="team-crest" src="'+s.team_crest+'" alt=""> ':''}${s.team_short||s.team_name}</td><td>${s.played}</td><td>${s.won}</td><td>${s.draw}</td><td>${s.lost}</td><td class="gd">${s.goal_difference>0?'+':''}${s.goal_difference}</td><td class="pts">${s.points}</td></tr>`;
}
html += '</tbody></table>';
}
if (matches.length) {
html += '<div class="group-matches">';
for (const m of matches) html += renderMatchRow(m);
html += '</div>';
}
html += '</div></div>';
}
html += '</div></div>';

if (data.knockout) {
for (const stage of stageOrder) {
const km = data.knockout[stage];
if (!km || !km.length) continue;
html += `<div class="wc-panel" id="wc-panel-${stage}"><div class="knockout-grid">`;
for (const m of km) html += renderKnockoutMatch(m);
html += '</div></div>';
}
}

el.innerHTML = html;
}

function renderMatchRow(m) {
const hc = m.home_team?.crest ? '<img class="match-crest" src="'+m.home_team.crest+'" alt="">' : '';
const ac = m.away_team?.crest ? '<img class="match-crest" src="'+m.away_team.crest+'" alt="">' : '';
let scoreHtml = '';
if (m.status==='FINISHED') {
scoreHtml = '<span class="finished-score">'+(m.score?.home??'-')+' - '+(m.score?.away??'-')+'</span>';
} else if (m.status==='IN_PLAY') {
const hs = m.score?.home!==null ? m.score.home : '?';
const as = m.score?.away!==null ? m.score.away : '?';
scoreHtml = '<span class="score-badge live">'+(hs)+' - '+(as)+'</span>';
} else {
scoreHtml = '<span class="score-badge" style="background:rgba(148,163,184,.1);color:var(--text-muted)">VS</span>';
}
let predHtml = '';
if ((m.status==='TIMED'||m.status==='SCHEDULED') && m.prediction) {
const p = m.prediction;
const maxProb = Math.max(p.home_win||0, p.draw||0, p.away_win||0);
if (maxProb > 0) {
const hw = (p.home_win/maxProb*100).toFixed(0);
const dw = (p.draw/maxProb*100).toFixed(0);
const aw = (p.away_win/maxProb*100).toFixed(0);
predHtml = '<div class="pred-probs"><span class="pp pp-home">L '+(p.home_win*100).toFixed(0)+'%</span><span class="pp pp-draw">E '+(p.draw*100).toFixed(0)+'%</span><span class="pp pp-away">V '+(p.away_win*100).toFixed(0)+'%</span></div>';
predHtml += '<div class="pred-bar"><span style="width:'+hw+'%;background:var(--primary)"></span><span style="width:'+dw+'%;background:var(--warning)"></span><span style="width:'+aw+'%;background:var(--info)"></span></div>';
}
}
let liveHtml = '';
if (m.status==='IN_PLAY')     liveHtml = '<div class="live-indicator"><span class="live-dot"></span> EN VIVO</div>';
return '<div class="group-match clickable" onclick="openModal('+m.id+')">' +
'<div class="teams"><div class="tm">'+hc+' '+ (m.home_team?.short||m.home_team?.name||'?') +'</div><div class="tm">'+ac+' '+ (m.away_team?.short||m.away_team?.name||'?') +'</div></div>' +
scoreHtml +
'<div class="match-date">' + formatDate(m.utc_date) + '</div>' +
liveHtml +
predHtml +
'</div>';
}

function renderKnockoutMatch(m) {
let html = '<div class="knockout-match clickable" onclick="openModal('+m.id+')"><div class="km-teams">';
const hc = m.home_team?.crest ? '<img class="match-crest" src="'+m.home_team.crest+'" alt="">' : '';
const ac = m.away_team?.crest ? '<img class="match-crest" src="'+m.away_team.crest+'" alt="">' : '';
const hs = m.status==='FINISHED' ? '<span class="finished-score">'+(m.score?.home??'-')+'</span>' : '';
const as = m.status==='FINISHED' ? '<span class="finished-score">'+(m.score?.away??'-')+'</span>' : '';
html += '<div class="km-team">'+hc+' '+ (m.home_team?.short||m.home_team?.name||'?') +'</div>';
html += hs ? '<div class="km-score">'+hs+' - '+as+'</div>' : '<span class="km-vs">VS</span>';
html += '<div class="km-team right">'+ (m.away_team?.short||m.away_team?.name||'?') +' '+ac+'</div>';
html += '</div>';
if (m.status==='TIMED'||m.status==='SCHEDULED') {
const p = m.prediction;
if (p) {
const maxProb = Math.max(p.home_win||0, p.draw||0, p.away_win||0);
if (maxProb > 0) {
html += '<div class="pred-probs">';
html += '<span class="pp pp-home">L ' + (p.home_win*100).toFixed(0)+'%</span>';
html += '<span class="pp pp-draw">E ' + (p.draw*100).toFixed(0)+'%</span>';
html += '<span class="pp pp-away">V ' + (p.away_win*100).toFixed(0)+'%</span>';
html += '</div>';
html += '<div class="pred-bar">';
const hw = (p.home_win/maxProb*100).toFixed(0);
const dw = (p.draw/maxProb*100).toFixed(0);
const aw = (p.away_win/maxProb*100).toFixed(0);
html += `<span style="width:${hw}%;background:var(--primary)"></span><span style="width:${dw}%;background:var(--warning)"></span><span style="width:${aw}%;background:var(--info)"></span>`;
html += '</div>';
}
}
} else if (m.status==='IN_PLAY') {
html += '<div class="live-indicator"><span class="live-dot"></span> EN VIVO</div>';
}
html += '<div style="font-size:.6875rem;color:var(--text-muted)">'+formatDate(m.utc_date)+'</div>';
html += '</div>';
return html;
}

function formatDate(utc) {
if (!utc) return '';
const d = new Date(utc);
return d.toLocaleDateString('es-MX', {timeZone:'America/Mexico_City',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function switchWCTab(tab) {
document.querySelectorAll('.wc-tab').forEach(t => t.classList.remove('active'));
document.querySelectorAll('.wc-panel').forEach(p => p.classList.remove('active'));
document.querySelector('.wc-tab[data-wc="'+tab+'"]')?.classList.add('active');
const panel = document.getElementById('wc-panel-'+tab);
if (panel) panel.classList.add('active');
}

/* ─────── TODAY'S MATCHES ─────── */
function flatMatches(data) {
const all = [];
for (const gk of Object.keys(data.groups || {})) {
for (const m of (data.groups[gk].matches || [])) all.push(m);
}
for (const stage of Object.keys(data.knockout || {})) {
for (const m of (data.knockout[stage] || [])) all.push(m);
}
return all;
}

async function loadToday() {
const el = document.getElementById('today-content');
if (!el) return;
showLoading(el);
const today = getMexicoDateStr();
const nowMX = getMexicoDate();
document.getElementById('today-date').textContent = nowMX.toLocaleDateString('es-MX', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
try {
if (!wcData) wcData = await apiGet(BASE + '/worldcup/');
const matches = flatMatches(wcData).filter(m => m.utc_date && getMexicoDateStr(new Date(m.utc_date)) === today);
if (!matches.length) {
el.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem 0">No hay partidos programados para hoy.</p>';
return;
}
renderMatchesList(el, matches);
} catch(e) { showError(el, 'Error al cargar: ' + e.message); }
}

/* ─────── UPCOMING ─────── */
async function loadUpcoming() {
const el = document.getElementById('upcoming-content');
if (!el) return;
showLoading(el);
const nowMX = getMexicoDate();
const tomorrow = new Date(nowMX);
tomorrow.setDate(tomorrow.getDate() + 1);
const tStr = getMexicoDateStr(tomorrow);
document.getElementById('upcoming-date').textContent = tomorrow.toLocaleDateString('es-MX', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
try {
if (!wcData) wcData = await apiGet(BASE + '/worldcup/');
const matches = flatMatches(wcData).filter(m => m.utc_date && getMexicoDateStr(new Date(m.utc_date)) === tStr);
if (!matches.length) {
el.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem 0">No hay partidos programados para mañana.</p>';
return;
}
renderMatchesList(el, matches);
} catch(e) { showError(el, 'Error al cargar: ' + e.message); }
}

/* ─────── RENDER MATCH LIST (Hoy / Próximos) ─────── */
function renderMatchesList(el, matches) {
let html = '';
for (const m of matches) html += renderMatchDetail(m);
el.innerHTML = html;
}

function renderMatchDetail(m) {
const isLive = m.status === 'IN_PLAY';
const isFinished = m.status === 'FINISHED';
const isScheduled = m.status === 'TIMED' || m.status === 'SCHEDULED';
const p = m.prediction || {};
const expH = p.expected_goals_home ?? (m.expected_goals?.home ?? null);
const expA = p.expected_goals_away ?? (m.expected_goals?.away ?? null);
const hw = isScheduled ? (p.home_win || 0) : null;
const dw = isScheduled ? (p.draw || 0) : null;
const aw = isScheduled ? (p.away_win || 0) : null;

const hc = m.home_team?.crest ? '<img class="match-crest" src="'+m.home_team.crest+'" alt="">' : '';
const ac = m.away_team?.crest ? '<img class="match-crest" src="'+m.away_team.crest+'" alt="">' : '';
const hn = m.home_team?.short || m.home_team?.name || '?';
const an = m.away_team?.short || m.away_team?.name || '?';

let scoreDisplay = '<span class="mc-vs">VS</span>';
let scoreClass = '';
if (isFinished) {
scoreDisplay = '<span class="mc-score">'+(m.score?.home??'-')+' - '+(m.score?.away??'-')+'</span>';
} else if (isLive) {
scoreDisplay = '<span class="mc-score live">'+(m.score?.home??'?')+' - '+(m.score?.away??'?')+'</span>';
scoreClass = ' live';
}

let bodyHtml = '';

if (expH !== null && expA !== null) {
// Expected Goals
const totalExp = expH + expA;
const scores = scoreProbsList(expH, expA);
const o25 = overProb(expH, expA, 2.5);
const o35 = overProb(expH, expA, 3.5);
const btts = bttsProb(expH, expA);

bodyHtml += '<div class="mc-grid">';
bodyHtml += '<div class="mc-stat"><div class="val">'+expH.toFixed(2)+'</div><div class="lbl">Goles Esp. Local</div></div>';
bodyHtml += '<div class="mc-stat"><div class="val">'+expA.toFixed(2)+'</div><div class="lbl">Goles Esp. Visita</div></div>';
bodyHtml += '<div class="mc-stat"><div class="val">'+totalExp.toFixed(2)+'</div><div class="lbl">Total Goles Esp.</div></div>';

if (isScheduled) {
const maxP = Math.max(hw, dw, aw);
const bestLabel = hw === maxP ? 'Local' : dw === maxP ? 'Empate' : 'Visita';
const bestPct = Math.max(hw, dw, aw);
bodyHtml += '<div class="mc-stat best"><div class="val">'+bestLabel+'</div><div class="lbl">Mejor Apost.</div></div>';

// Win probs bar
const maxBar = Math.max(hw, dw, aw, 0.01);
bodyHtml += '</div>';
bodyHtml += '<div class="lbl-section">Resultado</div>';
bodyHtml += '<div class="mc-probs">';
const outcomes = [
{hw, lbl:'Local', cls:'', pct:hw},
{dw, lbl:'Empate', cls:'', pct:dw},
{aw, lbl:'Visita', cls:'', pct:aw}
];
outcomes.forEach(o => {
const isBest = o.pct === maxP;
bodyHtml += '<div class="mc-prob'+(isBest?' highlight':'')+'"><div class="pct">'+(o.pct*100).toFixed(0)+'%</div><div class="plbl">'+o.lbl+'</div></div>';
});

// Probability bar
bodyHtml += '</div>';
bodyHtml += '<div class="mc-bar">';
const hwp = (hw/maxBar*100).toFixed(0);
const dwp = (dw/maxBar*100).toFixed(0);
const awp = (aw/maxBar*100).toFixed(0);
bodyHtml += '<span style="width:'+hwp+'%;background:var(--primary)"></span><span style="width:'+dwp+'%;background:var(--warning)"></span><span style="width:'+awp+'%;background:var(--info)"></span>';
bodyHtml += '</div>';
} else {
bodyHtml += '</div>';
}

// Exact scores
bodyHtml += '<div class="lbl-section">Marcadores Exactos</div>';
bodyHtml += '<div class="scores-grid">';
for (const s of scores) {
bodyHtml += '<div class="score-chip">'+s.h+' - '+s.a+' <span class="scp">'+(s.p*100).toFixed(1)+'%</span></div>';
}
bodyHtml += '</div>';

// O/U
bodyHtml += '<div class="lbl-section">Over / Under</div>';
bodyHtml += '<div class="ou-row">';
bodyHtml += '<div class="ou-badge over">O2.5 <span class="oup">'+(o25*100).toFixed(0)+'%</span></div>';
bodyHtml += '<div class="ou-badge under">U2.5 <span class="oup">'+((1-o25)*100).toFixed(0)+'%</span></div>';
bodyHtml += '<div class="ou-badge over">O3.5 <span class="oup">'+(o35*100).toFixed(0)+'%</span></div>';
bodyHtml += '<div class="ou-badge under">U3.5 <span class="oup">'+((1-o35)*100).toFixed(0)+'%</span></div>';
bodyHtml += '</div>';

// BTTS
bodyHtml += '<div class="lbl-section">BTTS</div>';
bodyHtml += '<div class="btts-row">';
bodyHtml += '<div class="btts-badge yes">Sí '+(btts*100).toFixed(0)+'%</div>';
bodyHtml += '<div class="btts-badge no">No '+((1-btts)*100).toFixed(0)+'%</div>';
bodyHtml += '</div>';

// Recommendations
if (isScheduled && hw !== null) {
const maxP = Math.max(hw, dw, aw);
const winnerLabel = hw === maxP ? 'Local' : dw === maxP ? 'Empate' : 'Visita';
const winnerPct = (maxP*100).toFixed(0);
const o25rec = o25 > 0.5 ? (1 - o25 < o25 ? 'Over 2.5' : 'Under 2.5') : 'Under 2.5';
const o25pct = o25 > 0.5 ? (o25*100).toFixed(0) : ((1-o25)*100).toFixed(0);
const bttsRec = btts > 0.5 ? 'Sí' : 'No';
const bttsPct = btts > 0.5 ? (btts*100).toFixed(0) : ((1-btts)*100).toFixed(0);
const confLvl = (maxP > 0.45 ? 'Alta' : maxP > 0.35 ? 'Media' : 'Baja');
bodyHtml += '<div class="lbl-section">🎯 Recomendaciones</div>';
bodyHtml += '<div class="rec-grid">';
bodyHtml += '<div class="rec-card resultado"><div class="rec-icon">🏆</div><div class="rec-label">Resultado</div><div class="rec-value">'+winnerLabel+'</div><div class="rec-pct">'+winnerPct+'% · Conf. '+confLvl+'</div></div>';
bodyHtml += '<div class="rec-card overunder"><div class="rec-icon">📊</div><div class="rec-label">Over/Under</div><div class="rec-value">'+o25rec+'</div><div class="rec-pct">'+o25pct+'%</div></div>';
bodyHtml += '<div class="rec-card btts"><div class="rec-icon">⚽</div><div class="rec-label">BTTS</div><div class="rec-value">'+bttsRec+'</div><div class="rec-pct">'+bttsPct+'%</div></div>';
bodyHtml += '</div>';
}
} else if (isLive) {
bodyHtml += '<div style="padding:.5rem;color:var(--success);font-weight:600;text-align:center">🔴 Partido en vivo</div>';
} else if (isFinished) {
bodyHtml += '<div style="padding:.5rem;color:var(--text-muted);text-align:center">✅ Finalizado</div>';
}

// Live indicator
if (isLive) {
bodyHtml = '<div class="live-indicator" style="margin-bottom:.75rem"><span class="live-dot"></span> EN VIVO</div>' + bodyHtml;
}

    return '<div class="match-card clickable" onclick="openModal('+m.id+')">' +
'<div class="mc-header">' +
'<div class="mc-teams">' +
'<div class="mc-team">'+hc+' '+hn+'</div>' +
'<div class="mc-team right">'+an+' '+ac+'</div>' +
'</div>' +
scoreDisplay +
'<span style="font-size:.6875rem;color:var(--text-muted)">'+(m.group ? m.group.replace('GROUP_','Grupo ')+' · ':'')+formatDate(m.utc_date)+'</span>' +
'</div>' +
'<div class="mc-body">'+bodyHtml+'</div>' +
'</div>';
}

/* ─────── VALUE BETS v2 ─────── */
async function loadValueBets() {
const el = document.getElementById('vb-content');
if (!el) return;
showLoading(el);
try {
if (!wcData) wcData = await apiGet(BASE + '/worldcup/');
const all = flatMatches(wcData);
    const upcoming = all.filter(m => m.status === 'TIMED' || m.status === 'SCHEDULED');
upcoming.sort((a,b) => (a.utc_date||'').localeCompare(b.utc_date||''));
renderValueBets(el, upcoming);
} catch(e) { showError(el, e.message); }
}

function renderValueBets(el, matches) {
if (!matches.length) {
el.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem 0">No hay partidos próximos con predicciones.</p>';
return;
}

let html = '<div class="stake-input-top">';
html += '<label>💰 Cantidad a apostar ($):</label>';
html += '<input type="number" id="vb-stake-amount" value="100" min="0" step="10" oninput="updateVB2Profits()">';
html += '</div>';

html += '<div class="vb2-grid">';
matches.forEach((m, idx) => {
const p = m.prediction || {};
const expH = p.expected_goals_home ?? null;
const expA = p.expected_goals_away ?? null;
const hw = p.home_win || 0;
const dw = p.draw || 0;
const aw = p.away_win || 0;
const maxP = Math.max(hw, dw, aw);
const outcomes = [
{lbl:'Local', key:'home_win', prob:hw},
{lbl:'Empate', key:'draw', prob:dw},
{lbl:'Visita', key:'away_win', prob:aw},
];
const best = outcomes.reduce((a,b) => a.prob > b.prob ? a : b);
const worst = outcomes.reduce((a,b) => a.prob < b.prob ? a : b);

const hn = m.home_team?.short || m.home_team?.name || '?';
const an = m.away_team?.short || m.away_team?.name || '?';
const ds = m.utc_date ? new Date(m.utc_date).toLocaleDateString('es-MX', {timeZone:'America/Mexico_City',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';

// Exact scores
let topScore = null;
if (expH !== null && expA !== null) {
const scores = scoreProbsList(expH, expA);
topScore = scores[0];
}

// Arriesgada: exact score
let arriesgadaLabel = '—', arriesgadaPct = 0;
if (topScore) {
arriesgadaLabel = topScore.h + '-' + topScore.a;
arriesgadaPct = topScore.p;
}

// Soñadora: worst outcome or a low-prob exact score
let sonadoraLabel = worst.lbl, sonadoraPct = worst.prob;
if (expH !== null && expA !== null) {
const scores = scoreProbsList(expH, expA);
const last = scores[scores.length-1];
if (last && last.p < sonadoraPct) {
sonadoraLabel = last.h + '-' + last.a;
sonadoraPct = last.p;
}
}

const oddsBest = (1 / best.prob).toFixed(2);
const oddsWorst = worst.prob > 0 ? (1 / worst.prob).toFixed(2) : '—';

html += '<div class="vb2-item" data-odds="'+oddsBest+'">';

// Header
html += '<div class="vb2-header">';
html += '<div><div class="vb2-match">'+hn+' vs '+an+'</div><div class="vb2-date">'+ds+(m.group?' · '+m.group.replace('GROUP_','Grupo '):'')+'</div></div>';
html += '</div>';

// Mejor Apuesta del Partido (featured)
html += '<div class="vb2-featured">';
html += '<div class="lbl">🎯 Mejor Apuesta del Partido</div>';
html += '<div class="val">'+best.lbl+'</div>';
html += '<div class="sub">'+(best.prob*100).toFixed(0)+'% de probabilidad · Cuota est. '+oddsBest+'</div>';
html += '</div>';

// 4 bet cards
html += '<div class="vb2-bets">';

// Segura (same as best)
html += '<div class="vb2-bet segura">';
html += '<div class="ico">✅</div><div class="cat">La Segura</div>';
html += '<div class="val">'+best.lbl+'</div>';
html += '<div class="sub">'+(best.prob*100).toFixed(0)+'%</div>';
html += '</div>';

// Recomendada (best value = same as best when no odds data)
const recProb = best.prob;
html += '<div class="vb2-bet recomendada">';
html += '<div class="ico">💎</div><div class="cat">Recomendada</div>';
html += '<div class="val">'+best.lbl+'</div>';
html += '<div class="sub">'+(recProb*100).toFixed(0)+'% · Cuota '+oddsBest+'</div>';
html += '</div>';

// Arriesgada
html += '<div class="vb2-bet arriesgada">';
html += '<div class="ico">⚡</div><div class="cat">Arriesgada</div>';
html += '<div class="val">'+arriesgadaLabel+'</div>';
html += '<div class="sub">'+(arriesgadaPct*100).toFixed(1)+'%</div>';
html += '</div>';

// Soñadora
html += '<div class="vb2-bet sonadora">';
html += '<div class="ico">🌟</div><div class="cat">Soñadora</div>';
html += '<div class="val">'+sonadoraLabel+'</div>';
html += '<div class="sub">'+(sonadoraPct*100).toFixed(1)+'%'+(worst.prob>0?' · Cuota '+oddsWorst:'')+'</div>';
html += '</div>';

html += '</div>'; // vb2-bets

// Stake
html += '<div class="vb-stake">';
html += '<span style="font-size:.8125rem;font-weight:500">'+best.lbl+':</span>';
html += '<span class="profit" id="vb-profit-'+idx+'">$0.00</span>';
html += '</div>';

html += '</div>'; // vb2-item
});
html += '</div>';

el.innerHTML = html;
updateVB2Profits();
}

function updateVB2Profits() {
const stake = parseFloat(document.getElementById('vb-stake-amount')?.value) || 0;
document.querySelectorAll('.vb2-item').forEach((item, i) => {
const odds = parseFloat(item.dataset.odds) || 1;
const profit = stake * (odds - 1);
const el = document.getElementById('vb-profit-' + i);
if (el) el.textContent = '$' + profit.toFixed(2);
});
}

/* ─────── MATCH DETAIL MODAL ─────── */
function openModal(matchId) {
const modal = document.getElementById('match-modal');
const body = document.getElementById('modal-body');
modal.classList.add('open');
body.innerHTML = '<div class="loading">Cargando detalle...</div>';
document.getElementById('modal-title').textContent = 'Detalle del Partido';
fetch(BASE + '/match-detail/' + matchId + '/')
.then(r => r.json())
.then(data => {
if (data.error) { body.innerHTML = '<div class="error">'+data.error+'</div>'; return; }
renderModalContent(data);
})
.catch(e => { body.innerHTML = '<div class="error">Error al cargar: '+e.message+'</div>'; });
}
function closeModal() {
document.getElementById('match-modal').classList.remove('open');
}
function renderModalContent(d) {
const isLive = d.status === 'IN_PLAY';
const isFinished = d.status === 'FINISHED';
const isScheduled = d.status === 'TIMED' || d.status === 'SCHEDULED';
const p = d.prediction || {};
const hn = d.home_team?.short || d.home_team?.name || '?';
const an = d.away_team?.short || d.away_team?.name || '?';
const hc = d.home_team?.crest ? '<img class="crest" src="'+d.home_team.crest+'" alt="">' : '';
const ac = d.away_team?.crest ? '<img class="crest" src="'+d.away_team.crest+'" alt="">' : '';
const homeScore = d.score?.home != null ? d.score.home : '?';
const awayScore = d.score?.away != null ? d.score.away : '?';
const dt = new Date(d.utc_date).toLocaleDateString('es-MX', {timeZone:'America/Mexico_City', weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});

let html = '';

// Score section
let statusBadge = '';
let scoreClass = '';
if (isLive) { statusBadge = '<span class="status-badge live">🔴 EN VIVO</span>'; scoreClass = 'live'; }
else if (isFinished) { statusBadge = '<span class="status-badge finished">✅ Finalizado</span>'; }
else { statusBadge = '<span class="status-badge scheduled">📅 Programado</span>'; }

html += '<div class="modal-score">';
html += '<div class="teams">';
html += '<div class="team">'+hc+'<div class="name">'+hn+'</div></div>';
html += '<div class="score-display '+scoreClass+'">'+(isScheduled?'VS':homeScore+' - '+awayScore)+'</div>';
html += '<div class="team">'+ac+'<div class="name">'+an+'</div></div>';
html += '</div>';
html += '<div>'+dt+'</div>';
html += statusBadge;
if (d.halftime_score?.home != null) {
html += '<div style="font-size:.75rem;color:var(--text-muted);margin-top:.25rem">Descanso: '+d.halftime_score.home+' - '+d.halftime_score.away+'</div>';
}
html += '</div>';

// Events timeline (goals, cards, subs)
if (d.events) {
html += '<div class="events-timeline"><h3>⚡ Eventos del Partido</h3>';
if (d.events.goals && d.events.goals.length) {
for (const g of d.events.goals) {
const icon = g.type === 'OWN_GOAL' ? '⚽' : g.type === 'PENALTY' ? '⚽' : '⚽';
const inj = g.injury_time ? '+' + g.injury_time : '';
html += '<div class="event-item goal"><span class="minute">'+g.minute+'\''+inj+'</span><span class="icon">'+icon+'</span><span class="desc"><strong>'+g.scorer_name+'</strong> ('+g.team_name+')</span><span style="font-size:.75rem;color:var(--text-muted)">'+(g.assist_name?'🇦 '+g.assist_name:'')+'</span></div>';
}
}
if (d.events.bookings && d.events.bookings.length) {
for (const b of d.events.bookings) {
const cardIcon = b.card === 'YELLOW_CARD' ? '🟨' : '🟥';
html += '<div class="event-item yellow-card"><span class="minute">'+b.minute+'\'</span><span class="icon">'+cardIcon+'</span><span class="desc"><strong>'+b.player_name+'</strong> ('+b.team_name+')</span></div>';
}
}
if (d.events.substitutions && d.events.substitutions.length) {
for (const s of d.events.substitutions) {
html += '<div class="event-item substitution"><span class="minute">'+s.minute+'\'</span><span class="icon">🔄</span><span class="desc">Sale: <strong>'+s.player_out_name+'</strong> · Entra: <strong>'+s.player_in_name+'</strong> ('+s.team_name+')</span></div>';
}
}
html += '</div>';
}

// Prediction & Markets
if (isScheduled && p.home_win != null) {
const hw = p.home_win || 0;
const dw = p.draw || 0;
const aw = p.away_win || 0;
const expH = p.expected_goals_home || 0;
const expA = p.expected_goals_away || 0;
const totalExp = expH + expA;
const maxP = Math.max(hw, dw, aw);
const bestLabel = hw === maxP ? 'Local' : dw === maxP ? 'Empate' : 'Visita';

html += '<div class="detail-grid">';

// Win probs
html += '<div class="detail-card"><h4>📊 Pronóstico del Partido</h4>';
const outcomes = [{lbl:'Local', prob:hw, color:'var(--primary)'},{lbl:'Empate', prob:dw, color:'var(--warning)'},{lbl:'Visita', prob:aw, color:'var(--info)'}];
for (const o of outcomes) {
const isBest = o.prob === maxP;
html += '<div class="row"><span>'+(isBest?'🏆 ':'')+o.lbl+'</span><span class="val'+(isBest?' positive':'')+'">'+(o.prob*100).toFixed(1)+'%</span></div>';
html += '<div class="prob-bar"><span style="width:'+(o.prob/maxP*100).toFixed(0)+'%;background:'+o.color+'"></span></div>';
}
html += '<div class="row" style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border)"><span>Confianza</span><span class="val info">'+(p.confidence*100).toFixed(0)+'%</span></div>';
html += '</div>';

// Expected Goals + Exact Scores
html += '<div class="detail-card"><h4>⚽ Goles Esperados</h4>';
html += '<div class="row"><span>'+hn+'</span><span class="val">'+expH.toFixed(2)+'</span></div>';
html += '<div class="row"><span>'+an+'</span><span class="val">'+expA.toFixed(2)+'</span></div>';
html += '<div class="row"><span>Total</span><span class="val">'+totalExp.toFixed(2)+'</span></div>';
if (d.exact_scores && d.exact_scores.length) {
html += '<div style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border)"><div style="font-size:.6875rem;color:var(--text-muted);margin-bottom:.375rem">Marcadores más probables:</div>';
for (const s of d.exact_scores.slice(0,5)) {
html += '<div class="row"><span>'+s.home+' - '+s.away+'</span><span class="val">'+(s.probability*100).toFixed(1)+'%</span></div>';
}
html += '</div>';
}
html += '</div>';

// Markets
if (d.markets) {
html += '<div class="detail-card"><h4>🎯 Mercados</h4>';
const ou = d.markets.over_under || {};
if (ou.over_2_5 != null) {
html += '<div class="row"><span>Over 2.5</span><span class="val '+(ou.over_2_5>0.5?'positive':'')+'">'+(ou.over_2_5*100).toFixed(0)+'%</span></div>';
html += '<div class="row"><span>Under 2.5</span><span class="val '+(ou.under_2_5>0.5?'positive':'')+'">'+(ou.under_2_5*100).toFixed(0)+'%</span></div>';
html += '<div class="row"><span>Over 3.5</span><span class="val">'+(ou.over_3_5*100).toFixed(0)+'%</span></div>';
}
const btts = d.markets.both_teams_score || {};
if (btts.yes != null) {
html += '<div style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border)">';
html += '<div class="row"><span>BTTS Sí</span><span class="val '+(btts.yes>0.5?'positive':'')+'">'+(btts.yes*100).toFixed(0)+'%</span></div>';
html += '<div class="row"><span>BTTS No</span><span class="val '+(btts.no>0.5?'positive':'')+'">'+(btts.no*100).toFixed(0)+'%</span></div>';
html += '</div>';
}
const dc = d.markets.double_chance || {};
if (dc.home_or_draw != null) {
html += '<div style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border)">';
html += '<div class="row"><span>Doble: '+hn+' o Empate</span><span class="val">'+(dc.home_or_draw*100).toFixed(0)+'%</span></div>';
html += '<div class="row"><span>Doble: '+an+' o Empate</span><span class="val">'+(dc.draw_or_away*100).toFixed(0)+'%</span></div>';
html += '</div>';
}
const eg = d.markets.exact_goals || {};
const egKeys = Object.keys(eg);
if (egKeys.length) {
html += '<div style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border)"><div style="font-size:.6875rem;color:var(--text-muted);margin-bottom:.375rem">Goles exactos:</div>';
for (const k of egKeys) {
html += '<div class="row"><span>'+k+' goles</span><span class="val">'+(eg[k]*100).toFixed(0)+'%</span></div>';
}
html += '</div>';
}
html += '</div>';
}

html += '</div>'; // detail-grid
}

// Specials
html += '<div class="detail-card"><h4>🌟 Especiales</h4>';
html += '<div class="specials-grid">';
html += '<div class="special-item"><div class="ico">⚽</div><div class="lbl">Anotador</div><div class="val">'+(d.specials?.anytime_goalscorer||'Por definir')+'</div></div>';
html += '<div class="special-item"><div class="ico">🟨</div><div class="lbl">Tarjetas</div><div class="val">'+(d.specials?.player_cards||'Por definir')+'</div></div>';
html += '<div class="special-item"><div class="ico">📐</div><div class="lbl">Tiros de Esquina</div><div class="val">'+(d.specials?.corners||'Por definir')+'</div></div>';
html += '<div class="special-item"><div class="ico">💵</div><div class="lbl">Mercado</div><div class="val">Apuestas en vivo</div></div>';
html += '</div></div>';

// Live stats placeholder
if (isLive) {
html += '<div class="detail-card" style="margin-top:1rem"><h4>📊 Estadísticas en Vivo</h4>';
html += '<p style="font-size:.8125rem;color:var(--text-muted);text-align:center;padding:.5rem">Los datos detallados de estadísticas (posesión, tiros, córners) se actualizan con la API de estadísticas en vivo. Próximamente más datos.</p>';
html += '</div>';
}

document.getElementById('modal-title').textContent = hn+' vs '+an;
body.innerHTML = html;
}
// Auto-load on page open
loadWorldCup();

// Cleanup timer on page navigation
window.addEventListener('beforeunload', stopWCRefresh);
</script>
